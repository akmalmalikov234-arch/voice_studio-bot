services:
  - type: web
    name: ai-voice-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: CARD_NUMBER
        sync: false
      - key: CARD_OWNER
        sync: false
      - key: APP_URL
        sync: false
      - key: WEBAPP_MAX_AGE
        value: "86400"
